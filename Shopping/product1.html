<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ShopCart | Cart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f7f8fa}.brand{font-weight:700}</style></head>
<body><nav class="navbar navbar-expand-lg bg-white border-bottom"><div class="container"><a class="navbar-brand brand text-primary" href="product.html">🛒 ShopCart</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="product.html">Products</a></li><li class="nav-item"><a class="nav-link active" href="product1.html">Cart</a></li><li class="nav-item"><a class="nav-link" href="order.html">Orders</a></li></ul></div></div></nav>
<main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h2">Shopping Cart</h1><a href="product.html" class="btn btn-outline-primary">Continue Shopping</a></div><div class="row g-4"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Total</th><th></th></tr></thead><tbody id="cartRows"></tbody></table></div><p id="empty" class="text-center text-secondary py-4 d-none">Your cart is empty.</p></div></div></div><div class="col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body"><h5>Order Summary</h5><div class="d-flex justify-content-between my-3"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><div class="d-flex justify-content-between mb-3"><span>Delivery</span><strong>Free</strong></div><hr><div class="d-flex justify-content-between fs-5"><strong>Total</strong><strong id="total">₹0</strong></div><button class="btn btn-primary w-100 mt-4" onclick="placeOrder()">Confirm Order</button><p class="small text-secondary mt-3 mb-0">Demo only. No payment will be collected.</p></div></div></div></div></main>
<footer class="bg-white border-top text-center py-4 text-secondary">© 2026 ShopCart. All Rights Reserved.</footer>
<script>
function cart(){return JSON.parse(localStorage.getItem('shopcart')||'[]')}function money(n){return '₹'+n.toLocaleString('en-IN')}
function save(c){localStorage.setItem('shopcart',JSON.stringify(c));render()}
function render(){let c=cart(),body=document.getElementById('cartRows');body.innerHTML='';document.getElementById('empty').classList.toggle('d-none',c.length>0);let sum=0;c.forEach((p,i)=>{sum+=p.price*p.qty;body.innerHTML+=`<tr><td class="fw-semibold">${p.name}</td><td>${money(p.price)}</td><td><div class="btn-group btn-group-sm"><button class="btn btn-outline-secondary" onclick="change(${i},-1)">−</button><button class="btn btn-light" disabled>${p.qty}</button><button class="btn btn-outline-secondary" onclick="change(${i},1)">+</button></div></td><td>${money(p.price*p.qty)}</td><td><button class="btn btn-sm btn-outline-danger" onclick="removeItem(${i})">Remove</button></td></tr>`});document.getElementById('subtotal').textContent=money(sum);document.getElementById('total').textContent=money(sum)}
function change(i,d){let c=cart();c[i].qty+=d;if(c[i].qty<1)c.splice(i,1);save(c)}function removeItem(i){let c=cart();c.splice(i,1);save(c)}
function placeOrder(){let c=cart();if(!c.length){alert('Your cart is empty.');return}let orders=JSON.parse(localStorage.getItem('shoporders')||'[]');orders.unshift({date:new Date().toLocaleString(),items:c,total:c.reduce((s,p)=>s+p.price*p.qty,0)});localStorage.setItem('shoporders',JSON.stringify(orders));localStorage.removeItem('shopcart');location.href='order.html'}
render();
</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
