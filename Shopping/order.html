<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ShopCart | Orders</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f7f8fa}.brand{font-weight:700}</style></head>
<body><nav class="navbar navbar-expand-lg bg-white border-bottom"><div class="container"><a class="navbar-brand brand text-primary" href="product.html">🛒 ShopCart</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="product.html">Products</a></li><li class="nav-item"><a class="nav-link" href="product1.html">Cart</a></li><li class="nav-item"><a class="nav-link active" href="order.html">Orders</a></li></ul></div></div></nav>
<main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h2">Your Orders</h1><a href="product.html" class="btn btn-primary">Shop Now</a></div><div id="orders"></div></main><footer class="bg-white border-top text-center py-4 text-secondary">© 2026 ShopCart. All Rights Reserved.</footer>
<script>
let orders=JSON.parse(localStorage.getItem('shoporders')||'[]'),root=document.getElementById('orders');if(!orders.length){root.innerHTML='<div class="card border-0 shadow-sm"><div class="card-body text-center py-5"><h5>No orders yet</h5><p class="text-secondary">Your confirmed orders will appear here.</p><a class="btn btn-primary" href="product.html">Browse Products</a></div></div>'}else{orders.forEach((o,i)=>{let rows=o.items.map(p=>`<li class="list-group-item d-flex justify-content-between"><span>${p.name} × ${p.qty}</span><strong>₹${(p.price*p.qty).toLocaleString('en-IN')}</strong></li>`).join('');root.innerHTML+=`<div class="card border-0 shadow-sm mb-3"><div class="card-header bg-white d-flex justify-content-between"><strong>Order ${orders.length-i}</strong><span class="text-secondary small">${o.date}</span></div><ul class="list-group list-group-flush">${rows}</ul><div class="card-body d-flex justify-content-between"><span class="text-success">Order confirmed (Demo)</span><strong>Total: ₹${o.total.toLocaleString('en-IN')}</strong></div></div>`})}
</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
