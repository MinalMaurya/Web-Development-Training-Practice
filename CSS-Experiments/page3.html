<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Centered Box Model Example</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center; 
      align-items: center;  
      background-color: #89db83;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 300px;
      height: 150px;
      background-color: lightblue;

      padding: 20px;
      border: 5px solid blue;
      margin: 30px;

      text-align: center;
      line-height: 1.5;
    }

  </style>
</head>
<body>

  <div class="box">
