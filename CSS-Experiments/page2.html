<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Background</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .content {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      top: 40%;
      font-size: 2em;
    }
  </style>
</head>
<body>

  <video autoplay muted loop>
    <source src="https://youtu.be/q2ODyRspX1g?si=_MmIU38eAkzDsYw0" type="video/mp4">
 
  </video>

  <div class="content">
    Welcome to My Website
  </div>

</body>
</html>
